<!doctype html>
<html lang="pt-BR" class="h-full bg-slate-50">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MultiPush - Gestão de Escalas</title>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel (for JSX) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#4f46e5", // Indigo 600
            primaryHover: "#4338ca", // Indigo 700
          },
        },
      },
    };
  </script>
  <style>
    .glass {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .toast-enter {
      animation: slideIn 0.3s ease-out forwards;
    }
  </style>
</head>

<body class="h-full text-slate-800 antialiased font-sans">
  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ─── API configuration ────────────────────────────────────────────────────
    const API_URL = 'http://localhost:3000';

    const apiFetch = async (path, options = {}) => {
      const token = localStorage.getItem('mp_token');
      const res = await fetch(`${API_URL}${path}`, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          ...(token ? { 'Authorization': `Bearer ${token}` } : {}),
          ...(options.headers || {}),
        },
      });
      if (res.status === 401) {
        localStorage.removeItem('mp_token');
        window.location.reload();
      }
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || `HTTP ${res.status}`);
      }
      if (res.status === 204) return null;
      return res.json();
    };

    // ─── Phone helpers ────────────────────────────────────────────────────────
    // Display format (XX) XXXXX-XXXX → E.164 +55XXXXXXXXXXX for API
    const toE164 = (phone) => {
      const digits = phone.replace(/\D/g, '');
      if (digits.startsWith('55') && digits.length >= 12) return '+' + digits;
      return '+55' + digits;
    };

    // ─── localStorage helpers (scales/Kanban only — teams are now in the API) ──
    const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2);
    const loadScales     = ()  => JSON.parse(localStorage.getItem('mp_scales')      || '[]');
    const saveScales     = (v) => localStorage.setItem('mp_scales',      JSON.stringify(v));

    // ─── Icon wrapper ─────────────────────────────────────────────────────────
    const Icon = ({ name, size = 20, className = "" }) => {
      useEffect(() => {
        lucide.createIcons();
      }, [name]);
      return (
        <i
          data-lucide={name}
          width={size}
          height={size}
          className={`inline-block ${className}`}
        ></i>
      );
    };

    // ─── Login Screen ─────────────────────────────────────────────────────────
    const LoginScreen = ({ onLoginSuccess }) => {
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [error, setError] = useState("");
      const [loading, setLoading] = useState(false);

      const handleLogin = async (e) => {
        e.preventDefault();
        setError("");
        setLoading(true);
        try {
          const data = await apiFetch('/auth/login', {
            method: 'POST',
            body: JSON.stringify({ email, password }),
          });
          localStorage.setItem('mp_token', data.access_token);
          onLoginSuccess({ email });
        } catch (err) {
          console.error("Login error:", err);
          setError("E-mail ou senha incorretos. Tente novamente.");
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 p-4">
          <div className="w-full max-w-md">
            <div className="glass rounded-3xl overflow-hidden shadow-2xl border border-white/10 animate-in fade-in zoom-in duration-500">
              <div className="p-8">
                <div className="flex flex-col items-center mb-8">
                  <div className="bg-primary text-white p-4 rounded-2xl shadow-xl shadow-indigo-500/20 mb-4 transform hover:rotate-12 transition-transform duration-300">
                    <Icon name="send" size={40} />
                  </div>
                  <h1 className="text-3xl font-black text-white tracking-tight">
                    MultiPush
                  </h1>
                  <p className="text-indigo-100 text-sm font-medium mt-1">
                    Gestão de Escalas e Equipes
                  </p>
                </div>

                <form onSubmit={handleLogin} className="space-y-6">
                  {error && (
                    <div className="bg-red-500/10 border border-red-500/20 text-red-400 p-3 rounded-xl text-sm flex items-center gap-2 animate-bounce">
                      <Icon name="alert-circle" size={18} />
                      {error}
                    </div>
                  )}

                  <div className="space-y-2">
                    <label className="text-xs font-bold text-slate-100 uppercase tracking-wider ml-1">
                      E-mail de Acesso
                    </label>
                    <div className="relative group">
                      <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-indigo-400 group-focus-within:text-white transition-colors">
                        <Icon name="mail" size={18} />
                      </div>
                      <input
                        required
                        type="email"
                        value={email}
                        onChange={(e) => setEmail(e.target.value)}
                        className="w-full bg-white/5 border border-white/10 rounded-2xl py-3 pl-12 pr-4 text-white placeholder-slate-400 outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all"
                        placeholder="nome@empresa.com"
                      />
                    </div>
                  </div>

                  <div className="space-y-2">
                    <label className="text-xs font-bold text-slate-100 uppercase tracking-wider ml-1">
                      Senha
                    </label>
                    <div className="relative group">
                      <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-indigo-400 group-focus-within:text-white transition-colors">
                        <Icon name="lock" size={18} />
                      </div>
                      <input
                        required
                        type="password"
                        value={password}
                        onChange={(e) => setPassword(e.target.value)}
                        className="w-full bg-white/5 border border-white/10 rounded-2xl py-3 pl-12 pr-4 text-white placeholder-slate-400 outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all"
                        placeholder="••••••••"
                      />
                    </div>
                  </div>

                  <button
                    disabled={loading}
                    type="submit"
                    className="w-full bg-primary hover:bg-primaryHover disabled:opacity-50 text-white font-bold py-4 rounded-2xl shadow-lg shadow-indigo-600/20 transition-all transform active:scale-[0.98] flex items-center justify-center gap-2"
                  >
                    {loading ? (
                      <div className="w-6 h-6 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                    ) : (
                      <>
                        <span>Entrar no Sistema</span>
                        <Icon name="chevron-right" size={18} />
                      </>
                    )}
                  </button>
                </form>

                <div className="mt-8 pt-6 border-t border-white/5 text-center">
                  <p className="text-slate-300/60 text-[10px] font-medium uppercase tracking-[0.2em]">
                    Painel de Controle v2.0
                  </p>
                </div>
              </div>
            </div>

            <p className="text-slate-400/50 text-center mt-6 text-xs">
              © 2026 MultiPush - Todos os direitos reservados
            </p>
          </div>
        </div>
      );
    };

    const MultiPushApp = () => {
      const [user, setUser] = useState(null);
      const [appLoading, setAppLoading] = useState(true);
      const [scales, setScales] = useState([]);
      const [teams, setTeams] = useState([]);
      const [users, setUsers] = useState([]);
      const [showModal, setShowModal] = useState(false);
      const [showTeamModal, setShowTeamModal] = useState(false);
      const [showUserModal, setShowUserModal] = useState(false);
      const [toast, setToast] = useState(null);

      // ── On mount: validate stored JWT, then load all data ──────────────────
      useEffect(() => {
        const token = localStorage.getItem('mp_token');
        if (!token) {
          setAppLoading(false);
          return;
        }
        apiFetch('/managers/me')
          .then((manager) => setUser({ email: manager.email, name: manager.name }))
          .catch(() => localStorage.removeItem('mp_token'))
          .finally(() => setAppLoading(false));
      }, []);

      // Load collaborators from API whenever the user is authenticated
      useEffect(() => {
        if (!user) return;
        apiFetch('/collaborators')
          .then((data) => {
            setUsers(data.map((c) => ({ ...c, teamId: c.teamId || '' })));
          })
          .catch(console.error);
      }, [user]);

      // Load teams from API and scales from localStorage whenever user is authenticated
      useEffect(() => {
        if (!user) return;
        apiFetch('/teams').then(setTeams).catch(console.error);
        setScales(loadScales().sort((a, b) => b.createdAt - a.createdAt));
      }, [user]);

      const handleLogout = () => {
        if (confirm("Deseja realmente sair do sistema?")) {
          localStorage.removeItem('mp_token');
          setUser(null);
        }
      };

      // Kanban State
      const [draggedScaleId, setDraggedScaleId] = useState(null);
      const KANBAN_STATUSES = ["Agendado", "Em Andamento", "Concluído"];

      // Focus Form Data
      const [teamFormData, setTeamFormData] = useState({ name: "" });
      const [userFormData, setUserFormData] = useState({
        name: "",
        teamId: "",
        phone: "",
      });

      // Editing State
      const [editingTeamId, setEditingTeamId] = useState(null);
      const [editingUserId, setEditingUserId] = useState(null);
      const [editingScaleId, setEditingScaleId] = useState(null);

      // Form State
      const [formData, setFormData] = useState({
        client: "",
        location: "",
        activity: "",
        team: "",
        vehicle: "",
        equipment: "",
        startDate: "",
        endDate: "",
      });

      const handleInputChange = (e) => {
        const { name, value } = e.target;
        setFormData((prev) => ({ ...prev, [name]: value }));
      };

      const handleSubmit = async (e) => {
        e.preventDefault();

        try {
          if (editingScaleId) {
            // Update scale in localStorage
            const updated = scales.map((s) =>
              s.id === editingScaleId ? { ...s, ...formData } : s
            );
            setScales(updated);
            saveScales(updated);
            setEditingScaleId(null);
            setToast("Escala atualizada com sucesso!");
          } else {
            // Persist new scale locally (Kanban state)
            const newScale = {
              id: genId(),
              ...formData,
              status: "Agendado",
              createdAt: Date.now(),
            };
            const updated = [newScale, ...scales];
            setScales(updated);
            saveScales(updated);

            // Trigger SMS via backend for the entire team in one request
            const selectedTeam = teams.find((t) => t.name === formData.team);
            if (selectedTeam) {
              try {
                await apiFetch('/schedules/team', {
                  method: 'POST',
                  body: JSON.stringify({
                    teamId: selectedTeam.id,
                    date: formData.startDate,
                    startTime: "08:00",
                    endTime: "17:00",
                    location: formData.location,
                    notes: `Cliente: ${formData.client}. Atividade: ${formData.activity}. Veículo: ${formData.vehicle}. Equipamentos: ${formData.equipment}. Previsão: ${formData.endDate || '—'}.`,
                  }),
                });
              } catch (err) {
                console.error('Falha ao disparar SMS para a equipe:', err);
              }
            }

            setToast("Escala publicada com sucesso! SMS disparado para a equipe.");
          }

          setShowModal(false);
          setFormData({
            client: "",
            location: "",
            activity: "",
            team: "",
            vehicle: "",
            equipment: "",
            startDate: "",
            endDate: "",
          });
        } catch (error) {
          console.error("Erro ao salvar escala:", error);
          alert("Erro ao salvar escala.");
        }

        setTimeout(() => setToast(null), 5000);
      };

      const handleEditScale = (scale) => {
        setEditingScaleId(scale.id);
        setFormData({
          client: scale.client,
          location: scale.location,
          activity: scale.activity,
          team: scale.team,
          vehicle: scale.vehicle,
          equipment: scale.equipment,
          startDate: scale.startDate || "",
          endDate: scale.endDate || "",
        });
        setShowModal(true);
      };

      const handleDeleteScale = (id) => {
        if (confirm("Deseja realmente excluir esta escala?")) {
          const updated = scales.filter((s) => s.id !== id);
          setScales(updated);
          saveScales(updated);
          setToast("Escala excluída com sucesso!");
          setTimeout(() => setToast(null), 3000);
        }
      };

      // ── Teams (API) ────────────────────────────────────────────────────────
      const handleTeamSubmit = async (e) => {
        e.preventDefault();
        try {
          if (editingTeamId) {
            const updated = await apiFetch(`/teams/${editingTeamId}`, {
              method: 'PATCH',
              body: JSON.stringify({ name: teamFormData.name }),
            });
            setTeams((prev) => prev.map((t) => (t.id === editingTeamId ? updated : t)));
            setEditingTeamId(null);
            setToast("Equipe atualizada com sucesso!");
          } else {
            const newTeam = await apiFetch('/teams', {
              method: 'POST',
              body: JSON.stringify({ name: teamFormData.name }),
            });
            setTeams((prev) => [...prev, newTeam]);
            setToast("Equipe cadastrada com sucesso!");
          }
          setTeamFormData({ name: "" });
        } catch (error) {
          setToast(`Erro: ${error.message}`);
        }
        setTimeout(() => setToast(null), 3000);
      };

      const handleEditTeam = (team) => {
        setEditingTeamId(team.id);
        setTeamFormData({ name: team.name });
      };

      const handleDeleteTeam = async (id) => {
        if (confirm("Deseja realmente excluir esta equipe?")) {
          try {
            await apiFetch(`/teams/${id}`, { method: 'DELETE' });
            setTeams((prev) => prev.filter((t) => t.id !== id));
            if (editingTeamId === id) {
              setEditingTeamId(null);
              setTeamFormData({ name: "" });
            }
            // Backend SET NULL handles the DB; update local state to reflect the change
            setUsers((prev) =>
              prev.map((u) => (u.teamId === id ? { ...u, teamId: '' } : u))
            );
            setToast("Equipe excluída com sucesso!");
          } catch (error) {
            setToast(`Erro: ${error.message}`);
          }
          setTimeout(() => setToast(null), 3000);
        }
      };

      // ── Collaborators (NestJS API) ─────────────────────────────────────────
      const handleUserSubmit = async (e) => {
        e.preventDefault();
        try {
          const e164 = toE164(userFormData.phone);
          const teamId = userFormData.teamId || null;
          if (editingUserId) {
            const updated = await apiFetch(`/collaborators/${editingUserId}`, {
              method: 'PATCH',
              body: JSON.stringify({ name: userFormData.name, phone: e164, teamId }),
            });
            setUsers((prev) =>
              prev.map((u) =>
                u.id === editingUserId
                  ? { ...updated, teamId: updated.teamId || '' }
                  : u
              )
            );
            setEditingUserId(null);
            setToast("Usuário atualizado com sucesso!");
          } else {
            const created = await apiFetch('/collaborators', {
              method: 'POST',
              body: JSON.stringify({ name: userFormData.name, phone: e164, teamId }),
            });
            setUsers((prev) => [...prev, { ...created, teamId: created.teamId || '' }]);
            setToast("Usuário cadastrado com sucesso!");
          }
          setUserFormData({ name: "", teamId: "", phone: "" });
        } catch (error) {
          console.error("Erro ao salvar usuário:", error);
          setToast(`Erro: ${error.message}`);
        }
        setTimeout(() => setToast(null), 3000);
      };

      const handleEditUser = (user) => {
        setEditingUserId(user.id);
        setUserFormData({
          name: user.name,
          teamId: String(user.teamId || ""),
          phone: user.phone || "",
        });
      };

      const handleDeleteUser = async (id) => {
        if (confirm("Deseja realmente excluir este usuário?")) {
          try {
            await apiFetch(`/collaborators/${id}`, { method: 'DELETE' });
            const assignments = loadAssignments();
            delete assignments[id];
            saveAssignments(assignments);
            setUsers((prev) => prev.filter((u) => u.id !== id));
            if (editingUserId === id) {
              setEditingUserId(null);
              setUserFormData({ name: "", teamId: "", phone: "" });
            }
            setToast("Usuário excluído com sucesso!");
          } catch (error) {
            console.error("Erro ao excluir usuário:", error);
          }
          setTimeout(() => setToast(null), 3000);
        }
      };

      const formatPhone = (value) => {
        if (!value) return value;
        const phoneNumber = value.replace(/[^\d]/g, "");
        const phoneNumberLength = phoneNumber.length;
        if (phoneNumberLength < 3) return phoneNumber;
        if (phoneNumberLength < 7) {
          return `(${phoneNumber.slice(0, 2)}) ${phoneNumber.slice(2)}`;
        }
        return `(${phoneNumber.slice(0, 2)}) ${phoneNumber.slice(2, 7)}-${phoneNumber.slice(7, 11)}`;
      };

      const handlePhoneChange = (e) => {
        const formattedValue = formatPhone(e.target.value);
        setUserFormData({ ...userFormData, phone: formattedValue });
      };

      // ── Kanban status (localStorage) ──────────────────────────────────────
      const handleStatusChange = (id, newStatus) => {
        const updated = scales.map((s) =>
          s.id === id ? { ...s, status: newStatus } : s
        );
        setScales(updated);
        saveScales(updated);
        setToast(`Status atualizado para: ${newStatus}`);
        setTimeout(() => setToast(null), 3000);
      };

      const onDragStart = (id) => {
        setDraggedScaleId(id);
      };

      const onDragOver = (e) => {
        e.preventDefault();
      };

      const onDrop = (status) => {
        if (draggedScaleId) {
          handleStatusChange(draggedScaleId, status);
          setDraggedScaleId(null);
        }
      };

      const getStatusColor = (status) => {
        switch (status) {
          case "Em Andamento":
            return "bg-blue-100 text-blue-800 border-blue-200";
          case "Concluído":
            return "bg-emerald-100 text-emerald-800 border-emerald-200";
          default:
            return "bg-amber-100 text-amber-800 border-amber-200";
        }
      };

      const getStatusIcon = (status) => {
        switch (status) {
          case "Em Andamento":
            return "play";
          case "Concluído":
            return "check-circle";
          default:
            return "calendar";
        }
      };

      if (appLoading) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-50">
            <div className="flex flex-col items-center gap-4">
              <div className="w-12 h-12 border-4 border-primary/20 border-t-primary rounded-full animate-spin"></div>
              <p className="text-slate-500 font-medium animate-pulse text-sm">Carregando...</p>
            </div>
          </div>
        );
      }

      if (!user) {
        return <LoginScreen onLoginSuccess={(u) => setUser(u)} />;
      }

      return (
        <div className="flex bg-slate-50 min-h-screen">
          {/* Sidebar Main Content Wrapper */}
          <div className="flex-1 flex flex-col">
            {/* Header */}
            <header className="glass sticky top-0 z-10 border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm">
              <div className="flex items-center gap-3">
                <div className="bg-primary text-white p-2 rounded-lg shadow-md">
                  <Icon name="send" size={24} />
                </div>
                <div>
                  <h1 className="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-primary to-indigo-400">
                    MultiPush
                  </h1>
                  <p className="text-xs text-slate-500 font-medium">
                    Informação Instantânea, Equipe Conectada
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-4">
                <div className="hidden sm:flex items-center gap-3 text-sm text-slate-600 bg-white px-3 py-1.5 rounded-full border border-slate-200 shadow-sm">
                  <div className="w-6 h-6 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-[10px] font-bold uppercase">
                    {user.email ? user.email.substring(0, 2) : "U"}
                  </div>
                  <div className="flex flex-col">
                    <span className="font-bold leading-tight">{user.email ? user.email.split('@')[0] : 'Usuário'}</span>
                    <span className="text-[10px] text-slate-400">Online</span>
                  </div>
                </div>
                <button
                  onClick={handleLogout}
                  className="bg-white hover:bg-red-50 text-slate-400 hover:text-red-500 p-2 rounded-xl border border-slate-200 shadow-sm transition-all transform hover:scale-105"
                  title="Sair"
                >
                  <Icon name="log-out" size={18} />
                </button>
                <button
                  onClick={() => setShowTeamModal(true)}
                  className="bg-white hover:bg-slate-50 text-slate-700 px-4 py-2 rounded-xl font-medium border border-slate-200 shadow-sm transition-all flex items-center gap-2 transform hover:scale-105"
                >
                  <Icon name="users" size={18} />
                  <span className="hidden sm:inline">Equipes</span>
                </button>
                <button
                  onClick={() => setShowUserModal(true)}
                  className="bg-white hover:bg-slate-50 text-slate-700 px-4 py-2 rounded-xl font-medium border border-slate-200 shadow-sm transition-all flex items-center gap-2 transform hover:scale-105"
                >
                  <Icon name="user-plus" size={18} />
                  <span className="hidden sm:inline">Usuários</span>
                </button>
                <button
                  onClick={() => setShowModal(true)}
                  className="bg-primary hover:bg-primaryHover text-white px-4 py-2 rounded-xl font-medium shadow-md shadow-indigo-200 transition-all flex items-center gap-2 transform hover:scale-105"
                >
                  <Icon name="plus" size={18} />
                  <span className="hidden sm:inline">Nova Escala</span>
                </button>
              </div>
            </header>

            {/* Main Dashboard - Kanban View */}
            <main className="p-6 flex-1 max-w-[1600px] mx-auto w-full flex flex-col">
              <div className="mb-6 flex justify-between items-end">
                <div>
                  <h2 className="text-2xl font-bold text-slate-800">
                    Quadro de Escalas
                  </h2>
                  <p className="text-slate-500 mt-1">
                    Gerencie as operações arrastando os cartões entre os status.
                  </p>
                </div>
              </div>

              {/* Kanban Board */}
              <div className="flex-1 flex flex-col md:flex-row gap-6 overflow-hidden">
                {KANBAN_STATUSES.map((status) => {
                  const statusScales = scales.filter((s) => s.status === status);
                  return (
                    <div
                      key={status}
                      onDragOver={onDragOver}
                      onDrop={() => onDrop(status)}
                      className="flex-1 flex flex-col min-w-[320px] bg-slate-100/50 rounded-2xl border border-slate-200/60 p-4"
                    >
                      <div className="flex items-center justify-between mb-4 px-2">
                        <div className="flex items-center gap-2">
                          <div className={`p-1.5 rounded-lg ${getStatusColor(status)}`}>
                            <Icon name={getStatusIcon(status)} size={16} />
                          </div>
                          <h3 className="font-bold text-slate-700 uppercase text-xs tracking-wider">
                            {status}
                          </h3>
                        </div>
                        <span className="bg-white text-slate-500 text-[10px] font-bold px-2 py-1 rounded-full border border-slate-200 shadow-sm">
                          {statusScales.length}
                        </span>
                      </div>

                      <div className="flex-1 space-y-4 overflow-y-auto pr-2 custom-scrollbar min-h-[200px]">
                        {statusScales.map((scale) => (
                          <div
                            key={scale.id}
                            draggable
                            onDragStart={() => onDragStart(scale.id)}
                            className="bg-white rounded-xl p-4 shadow-sm border border-slate-100 hover:shadow-md transition-all cursor-grab active:cursor-grabbing relative overflow-hidden group border-l-4"
                            style={{ borderLeftColor: status === "Em Andamento" ? "#3b82f6" : status === "Concluído" ? "#10b981" : "#f59e0b" }}
                          >
                            <div className="flex justify-between items-start mb-3">
                              <h4 className="font-bold text-slate-800 text-sm truncate pr-6">
                                {scale.client}
                              </h4>
                              <div className="absolute top-3 right-3 flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                <button
                                  onClick={() => handleEditScale(scale)}
                                  className="p-1 hover:bg-slate-100 rounded text-slate-400 hover:text-primary transition-colors"
                                  title="Editar"
                                >
                                  <Icon name="edit-2" size={14} />
                                </button>
                                <button
                                  onClick={() => handleDeleteScale(scale.id)}
                                  className="p-1 hover:bg-slate-100 rounded text-slate-400 hover:text-red-500 transition-colors"
                                  title="Excluir"
                                >
                                  <Icon name="trash-2" size={14} />
                                </button>
                                <div className="w-px h-4 bg-slate-200 mx-1 self-center"></div>
                                {status !== "Agendado" && (
                                  <button
                                    onClick={() => handleStatusChange(scale.id, KANBAN_STATUSES[KANBAN_STATUSES.indexOf(status) - 1])}
                                    className="p-1 hover:bg-slate-100 rounded text-slate-400 hover:text-primary transition-colors"
                                    title="Voltar Status"
                                  >
                                    <Icon name="chevron-left" size={14} />
                                  </button>
                                )}
                                {status !== "Concluído" && (
                                  <button
                                    onClick={() => handleStatusChange(scale.id, KANBAN_STATUSES[KANBAN_STATUSES.indexOf(status) + 1])}
                                    className="p-1 hover:bg-slate-100 rounded text-slate-400 hover:text-primary transition-colors"
                                    title="Avançar Status"
                                  >
                                    <Icon name="chevron-right" size={14} />
                                  </button>
                                )}
                              </div>
                            </div>

                            <div className="space-y-2.5">
                              <div className="flex items-start gap-2 text-xs text-slate-500">
                                <Icon name="map-pin" size={12} className="shrink-0 mt-0.5" />
                                <span className="line-clamp-1">{scale.location}</span>
                              </div>
                              <div className="flex items-center gap-2 text-xs text-slate-600">
                                <Icon name="users" size={12} className="shrink-0" />
                                <span className="font-medium">{scale.team}</span>
                              </div>
                              <div className="grid grid-cols-2 gap-2 text-[10px] text-slate-500 pt-1">
                                <div className="flex items-center gap-1.5">
                                  <Icon name="calendar" size={10} className="text-slate-400" />
                                  <span>Início: <span className="font-medium text-slate-600">{scale.startDate ? new Date(scale.startDate).toLocaleDateString('pt-BR') : '--/--/--'}</span></span>
                                </div>
                                <div className="flex items-center gap-1.5">
                                  <Icon name="check-circle" size={10} className="text-slate-400" />
                                  <span>Fim: <span className="font-medium text-slate-600">{scale.endDate ? new Date(scale.endDate).toLocaleDateString('pt-BR') : '--/--/--'}</span></span>
                                </div>
                              </div>
                              <div className="flex items-start gap-2 text-xs text-slate-400 pt-2 border-t border-slate-50">
                                <Icon name="tool" size={12} className="shrink-0 mt-0.5" />
                                <span className="line-clamp-1 italic">{scale.equipment}</span>
                              </div>
                            </div>
                          </div>
                        ))}
                        {statusScales.length === 0 && (
                          <div className="flex flex-col items-center justify-center py-8 opacity-40 border-2 border-dashed border-slate-200 rounded-xl">
                            <Icon name="inbox" size={32} className="mb-2 text-slate-300" />
                            <p className="text-[10px] font-medium text-slate-400">Vazio</p>
                          </div>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </main>
          </div>

          {/* Modal Overlay */}
          {showModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
              <div className="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh]">
                <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                  <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <Icon
                      name={editingScaleId ? "edit" : "calendar-plus"}
                      className="text-primary"
                    />
                    {editingScaleId ? "Editar Escala" : "Nova Escala"}
                  </h3>
                  <button
                    onClick={() => {
                      setShowModal(false);
                      setEditingScaleId(null);
                      setFormData({
                        client: "",
                        location: "",
                        activity: "",
                        team: "",
                        vehicle: "",
                        equipment: "",
                      });
                    }}
                    className="text-slate-400 hover:text-slate-600 p-1 rounded-lg hover:bg-slate-100 transition-colors"
                  >
                    <Icon name="x" />
                  </button>
                </div>

                <div className="p-6 overflow-y-auto">
                  <form
                    id="scaleForm"
                    onSubmit={handleSubmit}
                    className="space-y-4"
                  >
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">
                        Cliente *
                      </label>
                      <input
                        required
                        type="text"
                        name="client"
                        value={formData.client}
                        onChange={handleInputChange}
                        className="w-full px-4 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder:text-slate-400 bg-slate-50 focus:bg-white"
                        placeholder="Ex: Telecom S.A."
                      />
                    </div>

                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">
                        Local da Obra *
                      </label>
                      <input
                        required
                        type="text"
                        name="location"
                        value={formData.location}
                        onChange={handleInputChange}
                        className="w-full px-4 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder:text-slate-400 bg-slate-50 focus:bg-white"
                        placeholder="Ex: Rua das Flores, 123 - São José dos Campos"
                      />
                    </div>

                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">
                        Atividade *
                      </label>
                      <input
                        required
                        type="text"
                        name="activity"
                        value={formData.activity}
                        onChange={handleInputChange}
                        className="w-full px-4 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder:text-slate-400 bg-slate-50 focus:bg-white"
                        placeholder="Ex: Lançamento de Cabo"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <label className="block text-sm font-medium text-slate-700 mb-1">
                          Data de Início *
                        </label>
                        <input
                          required
                          type="date"
                          name="startDate"
                          value={formData.startDate}
                          onChange={handleInputChange}
                          className="w-full px-4 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all bg-slate-50 focus:bg-white text-slate-800"
                        />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-slate-700 mb-1">
                          Previsão de Conclusão *
                        </label>
                        <input
                          required
                          type="date"
                          name="endDate"
                          value={formData.endDate}
                          onChange={handleInputChange}
                          className="w-full px-4 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all bg-slate-50 focus:bg-white text-slate-800"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <label className="block text-sm font-medium text-slate-700 mb-1">
                          Equipe *
                        </label>
                        <select
                          required
                          name="team"
                          value={formData.team}
                          onChange={handleInputChange}
                          className="w-full px-4 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder:text-slate-400 bg-slate-50 focus:bg-white text-slate-800"
                        >
                          <option value="" disabled>
                            Selecione uma equipe
                          </option>
                          {teams.map((t) => (
                            <option key={t.id} value={t.name}>
                              {t.name}
                            </option>
                          ))}
                        </select>
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-slate-700 mb-1">
                          Veículo (Placa) *
                        </label>
                        <input
                          required
                          type="text"
                          name="vehicle"
                          value={formData.vehicle}
                          onChange={handleInputChange}
                          className="w-full px-4 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder:text-slate-400 bg-slate-50 focus:bg-white font-mono uppercase"
                          placeholder="ABC-1234"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">
                        Equipamentos *
                      </label>
                      <textarea
                        required
                        name="equipment"
                        value={formData.equipment}
                        onChange={handleInputChange}
                        rows="2"
                        className="w-full px-4 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder:text-slate-400 bg-slate-50 focus:bg-white resize-none"
                        placeholder="Ex: Escada, EPIs, Alicates..."
                      ></textarea>
                    </div>
                  </form>
                </div>

                <div className="px-6 py-4 border-t border-slate-100 bg-slate-50/80 flex justify-end gap-3">
                  <button
                    type="button"
                    onClick={() => {
                      setShowModal(false);
                      setEditingScaleId(null);
                      setFormData({
                        client: "",
                        location: "",
                        activity: "",
                        team: "",
                        vehicle: "",
                        equipment: "",
                        startDate: "",
                        endDate: "",
                      });
                    }}
                    className="px-4 py-2 text-slate-600 font-medium hover:bg-slate-200/50 rounded-xl transition-colors"
                  >
                    Cancelar
                  </button>
                  <button
                    type="submit"
                    form="scaleForm"
                    className="px-5 py-2 bg-primary hover:bg-primaryHover text-white font-medium rounded-xl shadow-md shadow-indigo-200 transition-all flex items-center gap-2 transform hover:scale-105"
                  >
                    <Icon
                      name={editingScaleId ? "save" : "smartphone"}
                      size={18}
                    />
                    {editingScaleId ? "Salvar Alterações" : "Publicar e Enviar SMS"}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Team Modal Overlay */}
          {showTeamModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
              <div className="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh]">
                <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                  <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <Icon name="users" className="text-primary" />
                    Gerenciar Equipes
                  </h3>
                  <button
                    onClick={() => {
                      setShowTeamModal(false);
                      setEditingTeamId(null);
                      setTeamFormData({ name: "" });
                    }}
                    className="text-slate-400 hover:text-slate-600 p-1 rounded-lg hover:bg-slate-100 transition-colors"
                  >
                    <Icon name="x" />
                  </button>
                </div>
                <div className="p-6 overflow-y-auto">
                  <form
                    id="teamForm"
                    onSubmit={handleTeamSubmit}
                    className="space-y-4 mb-6"
                  >
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">
                        Nome da Equipe *
                      </label>
                      <input
                        required
                        type="text"
                        name="name"
                        value={teamFormData.name}
                        onChange={(e) =>
                          setTeamFormData({ name: e.target.value })
                        }
                        className="w-full px-4 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder:text-slate-400 bg-slate-50 focus:bg-white"
                        placeholder="Ex: Equipe Delta"
                      />
                    </div>
                    <div className="flex justify-end pt-2 gap-3">
                      {editingTeamId && (
                        <button
                          type="button"
                          onClick={() => {
                            setEditingTeamId(null);
                            setTeamFormData({ name: "" });
                          }}
                          className="px-4 py-2 text-slate-600 font-medium hover:bg-slate-100 rounded-xl transition-all"
                        >
                          Cancelar
                        </button>
                      )}
                      <button
                        type="submit"
                        className="px-5 py-2 bg-primary hover:bg-primaryHover text-white font-medium rounded-xl shadow-md transition-all flex items-center gap-2"
                      >
                        <Icon name={editingTeamId ? "save" : "plus"} size={18} />
                        {editingTeamId ? "Salvar Alterações" : "Adicionar Equipe"}
                      </button>
                    </div>
                  </form>
                  <div>
                    <h4 className="text-sm font-bold text-slate-700 mb-3">
                      Equipes Cadastradas
                    </h4>
                    <ul className="space-y-2">
                      {teams.map((t) => (
                        <li
                          key={t.id}
                          className="p-3 bg-slate-50 border border-slate-100 rounded-lg text-sm text-slate-700 flex justify-between items-center group"
                        >
                          <div className="flex flex-col">
                            <span className="font-medium">{t.name}</span>
                            <span className="text-xs text-slate-400">
                              ID: {t.id}
                            </span>
                          </div>
                          <div className="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button
                              type="button"
                              onClick={() => handleEditTeam(t)}
                              className="text-slate-400 hover:text-primary transition-colors p-1"
                              title="Editar"
                            >
                              <Icon name="edit-2" size={16} />
                            </button>
                            <button
                              type="button"
                              onClick={() => handleDeleteTeam(t.id)}
                              className="text-slate-400 hover:text-red-500 transition-colors p-1"
                              title="Excluir"
                            >
                              <Icon name="trash-2" size={16} />
                            </button>
                          </div>
                        </li>
                      ))}
                      {teams.length === 0 && (
                        <p className="text-sm text-slate-500">
                          Nenhuma equipe cadastrada.
                        </p>
                      )}
                    </ul>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* User Modal Overlay */}
          {showUserModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
              <div className="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh]">
                <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                  <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <Icon name="user-plus" className="text-primary" />
                    Gerenciar Usuários
                  </h3>
                  <button
                    onClick={() => {
                      setShowUserModal(false);
                      setEditingUserId(null);
                      setUserFormData({ name: "", teamId: "", phone: "" });
                    }}
                    className="text-slate-400 hover:text-slate-600 p-1 rounded-lg hover:bg-slate-100 transition-colors"
                  >
                    <Icon name="x" />
                  </button>
                </div>
                <div className="p-6 overflow-y-auto">
                  <form
                    id="userForm"
                    onSubmit={handleUserSubmit}
                    className="space-y-4 mb-6"
                  >
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">
                        Nome do Usuário *
                      </label>
                      <input
                        required
                        type="text"
                        name="name"
                        value={userFormData.name}
                        onChange={(e) =>
                          setUserFormData({
                            ...userFormData,
                            name: e.target.value,
                          })
                        }
                        className="w-full px-4 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder:text-slate-400 bg-slate-50 focus:bg-white"
                        placeholder="Ex: João Silva"
                      />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">
                        Telefone (SMS) *
                      </label>
                      <input
                        required
                        type="text"
                        name="phone"
                        value={userFormData.phone}
                        onChange={handlePhoneChange}
                        className="w-full px-4 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder:text-slate-400 bg-slate-50 focus:bg-white"
                        placeholder="(00) 00000-0000"
                        maxLength="15"
                      />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">
                        Equipe *
                      </label>
                      <select
                        required
                        name="teamId"
                        value={userFormData.teamId}
                        onChange={(e) =>
                          setUserFormData({
                            ...userFormData,
                            teamId: e.target.value,
                          })
                        }
                        className="w-full px-4 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all bg-slate-50 focus:bg-white text-slate-800"
                      >
                        <option value="" disabled>
                          Selecione uma equipe
                        </option>
                        {teams.map((t) => (
                          <option key={t.id} value={t.id}>
                            {t.name}
                          </option>
                        ))}
                      </select>
                    </div>
                    <div className="flex justify-end pt-2 gap-3">
                      {editingUserId && (
                        <button
                          type="button"
                          onClick={() => {
                            setEditingUserId(null);
                            setUserFormData({ name: "", teamId: "", phone: "" });
                          }}
                          className="px-4 py-2 text-slate-600 font-medium hover:bg-slate-100 rounded-xl transition-all"
                        >
                          Cancelar
                        </button>
                      )}
                      <button
                        type="submit"
                        className="px-5 py-2 bg-primary hover:bg-primaryHover text-white font-medium rounded-xl shadow-md transition-all flex items-center gap-2"
                      >
                        <Icon name={editingUserId ? "save" : "plus"} size={18} />
                        {editingUserId ? "Salvar Alterações" : "Adicionar Usuário"}
                      </button>
                    </div>
                  </form>
                  <div>
                    <h4 className="text-sm font-bold text-slate-700 mb-3">
                      Usuários Cadastrados
                    </h4>
                    <ul className="space-y-2">
                      {users.map((u) => {
                        const userTeam = teams.find((t) => String(t.id) === String(u.teamId));
                        return (
                          <li
                            key={u.id}
                            className="p-3 bg-slate-50 border border-slate-100 rounded-lg text-sm text-slate-700 flex justify-between items-center group"
                          >
                            <div className="flex flex-col">
                              <div className="flex items-center gap-2">
                                <span className="font-medium">{u.name}</span>
                                <span className="text-[10px] text-slate-400 font-mono">
                                  {u.phone}
                                </span>
                              </div>
                              <span className="text-xs bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full w-fit mt-1">
                                {userTeam ? userTeam.name : "Sem Equipe"}
                              </span>
                            </div>
                            <div className="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                              <button
                                type="button"
                                onClick={() => handleEditUser(u)}
                                className="text-slate-400 hover:text-primary transition-colors p-1"
                                title="Editar"
                              >
                                <Icon name="edit-2" size={16} />
                              </button>
                              <button
                                type="button"
                                onClick={() => handleDeleteUser(u.id)}
                                className="text-slate-400 hover:text-red-500 transition-colors p-1"
                                title="Excluir"
                              >
                                <Icon name="trash-2" size={16} />
                              </button>
                            </div>
                          </li>
                        );
                      })}
                      {users.length === 0 && (
                        <p className="text-sm text-slate-500">
                          Nenhum usuário cadastrado.
                        </p>
                      )}
                    </ul>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 flex items-center gap-3 bg-emerald-50 border border-emerald-200 text-emerald-800 px-5 py-4 rounded-xl shadow-lg toast-enter max-w-sm">
              <div className="bg-emerald-100 p-2 rounded-full shrink-0">
                <Icon
                  name="check-circle"
                  className="text-emerald-600"
                  size={24}
                />
              </div>
              <p className="text-sm font-medium">{toast}</p>
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<MultiPushApp />);
  </script>
</body>

</html>
